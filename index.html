<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINTESS Central</title>
<meta name="theme-color" content="#0A0F0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MINTESS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0A0F0E; --s1:#101816; --s2:#16201E; --s3:#1E2B28; --line:#26352F;
  --tx:#EEF7F4; --mu:#9DB3AD; --mu2:#6F8781;
  --mint:#3FE0B0; --mint2:#7DF0CC; --ink:#04241A;
  --green:#3FE0B0; --yellow:#F2C94C; --orange:#FF8A3D; --rose:#FF5C7A; --blue:#6EA8FF;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;background:var(--bg);color:var(--tx)}
body{font:13px/1.45 Poppins,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
a{color:var(--mint2)}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.2}
.glow i:nth-child(1){width:440px;height:440px;background:var(--mint);top:-180px;right:-140px}
.glow i:nth-child(2){width:380px;height:380px;background:#2D6BFF;bottom:-200px;left:-160px;opacity:.12}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--ink)}
.brand b{font-weight:900;font-size:19px;letter-spacing:-.4px;line-height:1}
.brand b small{display:block;font-size:10px;font-weight:600;letter-spacing:2.5px;color:var(--mint);margin-top:3px}

#login{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:380px;background:rgba(16,24,22,.85);border:1px solid var(--line);border-radius:20px;padding:26px 22px;backdrop-filter:blur(12px)}
.lcard p.sub{color:var(--mu);margin:12px 0 16px;font-size:12.5px}
.lcard label{display:block;font-size:11.5px;color:var(--mu);margin:10px 0 4px}
.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0}
.in:focus{border-color:var(--mint)}
textarea.in{resize:vertical;min-height:80px}
select.in{appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 15px;font-weight:600;font-size:12.5px;min-height:36px;white-space:nowrap}
.btn.pri{background:var(--mint);color:var(--ink)} .btn.pri:hover{background:var(--mint2)}
.btn.sec{background:var(--s3);border:1px solid var(--line)}
.btn.ghost{color:var(--mu)}
.btn.warn{background:#3a1520;color:var(--rose);border:1px solid #5a2433}
.btn.org{background:#3d220c;color:var(--orange);border:1px solid #6b3a14}
.btn.yel{background:#3a320e;color:var(--yellow);border:1px solid #6b5a14}
.btn.full{width:100%}
.btn.sm{padding:5px 11px;min-height:30px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.msg{font-size:12px;margin-top:10px;min-height:16px}
.msg.err{color:var(--rose)} .msg.ok{color:var(--mint)}

#app{position:relative;z-index:1;display:flex;min-height:100vh}
#side{width:210px;flex:none;background:rgba(16,24,22,.92);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{padding:2px 6px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--mu);text-align:left;width:100%}
.nav .ic{width:20px;text-align:center;font-size:14px}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,rgba(63,224,176,.18),rgba(63,224,176,.03));color:var(--tx);box-shadow:inset 3px 0 0 var(--mint)}
.nav .badge{margin-left:auto;background:var(--mint);color:var(--ink);font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:11px;color:var(--mu)}
.side-foot .who{color:var(--tx);font-weight:600;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--s3);color:var(--mu);border:1px solid var(--line);white-space:nowrap}
.chip.hot{color:var(--mint);border-color:#1f5c48;background:#0f2a22}
.chip.ask{color:var(--yellow);border-color:#5a4a13;background:#2a240c}
.chip.done{color:var(--mu)}
.chip.red{color:var(--rose);border-color:#5a2433;background:#2b1219}
.rolesw{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
main{flex:1;min-width:0;padding:16px 20px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.top .sp{flex:1}
.demo-bar{background:#0f2a22;border:1px solid #1f5c48;color:var(--mint2);border-radius:10px;padding:7px 11px;font-size:11.5px;margin-bottom:12px}
#bottom{display:none}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.card .l{font-size:11px;color:var(--mu)} .card .v{font-size:20px;font-weight:800;margin-top:2px}
.card .d{font-size:10.5px;color:var(--mu2)}
.card.hl{border-color:#1f5c48;background:linear-gradient(135deg,#0f2a22,var(--s1))}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:12px}
.panel h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.empty{color:var(--mu);font-size:12.5px;padding:16px 4px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:5px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mu);font-size:12px;font-weight:600}
.tab.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;color:var(--mu2);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
td{padding:8px;border-bottom:1px solid #1c2825;font-size:12.5px;vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--s2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right} .muted{color:var(--mu)} .small{font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fx{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.fx:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.fx.verde{background:#0f2a22;color:var(--green)} .fx.amarelo{background:#3a320e;color:var(--yellow)}
.fx.laranja{background:#3d220c;color:var(--orange)} .fx.vermelho{background:#3b1418;color:var(--rose)}

.f{margin-bottom:11px}
.f>label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:4px;font-weight:500}
.f>label em{color:var(--mint);font-style:normal}
.pk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.pk button{padding:5px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:12px;min-height:32px}
.pk button.on{background:var(--mint);border-color:var(--mint);color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#mback{position:fixed;inset:0;background:rgba(2,6,5,.74);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:620px;background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px #000}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h2{font-size:15px;font-weight:800;flex:1}
.mb{padding:14px 16px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.steps{display:flex;gap:4px;margin:10px 0 14px}
.steps div{flex:1;text-align:center;font-size:10.5px;color:var(--mu2)}
.steps div:before{content:"";display:block;height:5px;border-radius:9px;background:var(--s3);margin-bottom:5px}
.steps div.done{color:var(--tx)} .steps div.done:before{background:var(--mint)}
.steps div.now{color:var(--mint2);font-weight:700} .steps div.now:before{background:linear-gradient(90deg,var(--mint),#1f5c48)}
.box{border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:12.5px;border:1px solid var(--line);background:var(--s2)}
.box b.t{display:block;margin-bottom:3px}
.box.verde{border-color:#1f5c48} .box.amarelo{border-color:#6b5a14} .box.laranja{border-color:#80451a} .box.vermelho{border-color:#7a2531}
.box.ask{border-color:#6b5a14;background:#1e1a0b}
.prep{background:#0d1f1a;border:1px solid #1f5c48;border-radius:14px;padding:12px;margin:12px 0}
.prep h4{font-size:12px;color:var(--mint);margin-bottom:8px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.prep h4 .sp{flex:1}
.prep ol{margin:4px 0 8px 18px} .prep li{margin-bottom:3px}
.prep pre{white-space:pre-wrap;font:11.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;color:var(--mu)}
.dec{display:flex;gap:6px;flex-wrap:wrap}
.decbox{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.tl{list-style:none;border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl li{position:relative;padding:0 0 10px;font-size:12px}
.tl li:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.tl li.int:before{background:var(--mu2)}
.tl li .w{color:var(--mu2);font-size:10.5px}
.shot{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.bar{height:6px;background:var(--s3);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--mint)}
.hero{background:linear-gradient(135deg,rgba(63,224,176,.14),rgba(45,107,255,.06));border:1px solid #1f5c48;border-radius:14px;padding:14px;margin-bottom:12px}
.hero h2{font-size:15px;margin-bottom:4px}
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.pcard:hover{border-color:#1f5c48}
.pcard .h{display:flex;gap:8px;align-items:flex-start}
.pcard .h b{flex:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--mint);border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--mint);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:700;font-size:12.5px;z-index:80;box-shadow:0 10px 30px -10px #000;max-width:90vw;text-align:center}

@media (max-width:860px){
  #side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 60px -20px #000}
  #side.open{transform:none}
  main{padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
  .cards{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  #bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,15,14,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
  #bottom button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu);gap:1px;padding:4px 0}
  #bottom button .ic{font-size:16px} #bottom button.on{color:var(--mint)}
  .hide-m{display:none}
  #mback{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100vh;border:0}
  .modal.wide{max-width:none}
  .mh{position:sticky;top:0;background:var(--s1);z-index:2;padding-top:calc(14px + env(safe-area-inset-top))}
  .mf{position:sticky;bottom:0;background:var(--s1);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media (min-width:861px){ .only-m{display:none!important} }
</style>
</head>
<body>
<div class="glow"><i></i><i></i></div>

<section id="login">
  <div class="lcard">
    <div class="brand"><div class="logo">M</div><b>MINTESS<small>CENTRAL</small></b></div>
    <p class="sub">Peça ajustes no seu sistema e acompanhe cada etapa.</p>
    <label for="lemail">E-mail</label>
    <input id="lemail" class="in" type="email" autocomplete="username" placeholder="voce@empresa.com">
    <label for="lpass">Senha</label>
    <input id="lpass" class="in" type="password" autocomplete="current-password" placeholder="••••••">
    <div class="row" style="margin-top:14px">
      <button class="btn pri" style="flex:1" data-act="login">Entrar</button>
      <button class="btn sec" data-act="signup">Criar conta</button>
    </div>
    <div id="lmsg" class="msg"></div>
    <div style="margin-top:12px;text-align:center"><button class="btn ghost" data-act="demo">▶ Ver demonstração (dados fictícios)</button></div>
  </div>
</section>

<div id="app" hidden>
  <aside id="side"></aside>
  <main>
    <div id="demobar" class="demo-bar" hidden></div>
    <div class="top">
      <button class="btn sec sm only-m" data-act="menu" aria-label="Menu">☰</button>
      <h1 id="ttl"></h1>
      <div class="sp"></div>
      <button class="btn pri" id="novoBtn" data-act="pedidoNovo" hidden>＋ Novo pedido</button>
    </div>
    <div id="view"></div>
  </main>
  <nav id="bottom"></nav>
</div>

<div id="mback" hidden><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v===null||v===undefined||v==="") return 0; const s=String(v).replace(/\s/g,""); const n=Number(s.includes(",")?s.replace(/\./g,"").replace(",","."):s); return isNaN(n)?0:n; };
const pad = n => String(n).padStart(2,"0");
const dt = d => { if(!d) return ""; d=new Date(d); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const mesAtual = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const hrs = n => String(Math.round((Number(n)||0)*100)/100).replace(".",",")+" h";
const desde = d => { const m=Math.floor((Date.now()-new Date(d))/60000); if(m<60) return m+" min"; if(m<1440) return Math.floor(m/60)+" h"; return Math.floor(m/1440)+" d"; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Math.random().toString(36).slice(2)+Date.now());
const clone = o => JSON.parse(JSON.stringify(o));
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2800); }

const CFG = window.MC_CONFIG || {};
const PRAZO = CFG.prazo || "até 2 dias úteis";
// status interno → como o cliente vê
const CL = {recebido:"Recebido", preparando:"Em produção", aguardando_ok:"Em produção", ajustar:"Em produção", aguardando_cliente:"Precisamos de uma informação", no_ar:"Pronto · no ar", orcamento:"Orçamento", recusado:"Não é possível"};
const IN = {recebido:"Novo", preparando:"Claude preparando", aguardando_ok:"Para o seu OK", ajustar:"Ajustando", aguardando_cliente:"Aguardando cliente", no_ar:"No ar", orcamento:"Orçamento", recusado:"Recusado"};
const FECHADOS = ["no_ar","orcamento","recusado"];
const FX = {
  verde:{t:"Verde · ajuste simples", m:"Ajuste simples. Você recebe retorno "+PRAZO+"."},
  amarelo:{t:"Amarelo · com análise", m:"Mexe em dados ou regras — passa por análise. Você recebe retorno "+PRAZO+"."},
  laranja:{t:"Laranja · funcionalidade nova", m:"Parece uma funcionalidade nova. A MINTESS vai avaliar e, se for o caso, enviar um orçamento."},
  vermelho:{t:"Vermelho · talvez não seja possível", m:"Pode não ser possível neste tipo de sistema. A MINTESS vai explicar e sugerir uma alternativa."}
};
const PAPEL = {pendente:"Aguardando aprovação", cliente:"Cliente", mintess:"MINTESS"};
const TIPOS = ["Visual / cores","Texto / nome","Filtro ou busca","Campo novo","Regra / cálculo","Tela nova","Relatório","Erro / bug","Integração","Módulo novo"];

function triagem(tipo, texto){
  const t = (" "+(texto||"")+" ").toLowerCase();
  const tem = arr => arr.some(k => t.includes(k));
  if (tem(["bluetooth","nfc","app store","play store","google play","segundo plano","número do cartão","numero do cartao","guardar cartão","guardar cartao"])) return "vermelho";
  if (tem(["ifood","rappi","whatsapp","nota fiscal","nfe","nf-e","nfc-e","cupom fiscal","integra","api ","maquininha","stone","cielo","pagseguro","mercado pago","sms","banco ","impressora","módulo","modulo"])) return "laranja";
  return ({"Visual / cores":"verde","Texto / nome":"verde","Filtro ou busca":"verde","Integração":"laranja","Módulo novo":"laranja"})[tipo] || "amarelo";
}

/* ================= dados ================= */
let sb = null, MODE = null;
const S = { user:null, perfil:null, clientes:[], sistemas:[], pedidos:[], preparos:[], hist:[], perfis:[], view:null, tab:"ok", tabCli:"abertos", filtroCli:"", preparando:{} };
const DEMO = { clientes:[], sistemas:[], pedidos:[], preparos:[], hist:[], perfis:[] };
const TBL = { clientes:"mc_clientes", sistemas:"mc_sistemas", pedidos:"mc_pedidos", preparos:"mc_preparos", hist:"mc_hist", perfis:"mc_perfis" };
const KEY = { perfis:"user_id", preparos:"pedido_id" };
const ehM = () => S.perfil?.papel === "mintess";

const db = {
  async list(k){
    if (MODE==="demo"){
      let a = clone(DEMO[k]);
      if (!ehM()){ // o que o cliente pode ver
        const c = S.perfil.cliente_id;
        if (k==="clientes") a = a.filter(x=>x.id===c);
        if (k==="sistemas"||k==="pedidos") a = a.filter(x=>x.cliente_id===c);
        if (k==="hist"){ const ids = DEMO.pedidos.filter(p=>p.cliente_id===c).map(p=>p.id); a = a.filter(x=>!x.interno && ids.includes(x.pedido_id)); }
        if (k==="preparos"||k==="perfis") a = [];
      }
      return a;
    }
    let q = sb.from(TBL[k]).select("*");
    q = k==="clientes"||k==="sistemas" ? q.order("nome") : q.order("created_at",{ascending:false});
    const {data,error} = await q; if (error) throw error; return data||[];
  },
  async ins(k,row){
    if (MODE==="demo") return demoIns(k,row);
    const {data,error} = await sb.from(TBL[k]).insert(row).select().single(); if (error) throw error; return data;
  },
  async upd(k,id,patch){
    if (MODE==="demo") return demoUpd(k,id,patch);
    const {data,error} = await sb.from(TBL[k]).update(patch).eq(KEY[k]||"id",id).select().single(); if (error) throw error; return data;
  },
  async upsertPrep(row){
    if (MODE==="demo"){ const e=DEMO.preparos.find(x=>x.pedido_id===row.pedido_id); if(e) Object.assign(e,row,{updated_at:new Date().toISOString()}); else DEMO.preparos.push(Object.assign({plano:[],perguntas:[]},row)); return clone(DEMO.preparos.find(x=>x.pedido_id===row.pedido_id)); }
    const {data,error} = await sb.from("mc_preparos").upsert(row).select().single(); if (error) throw error; return data;
  },
  async preparar(pedido_id, nota){
    if (MODE==="demo") return demoPreparar(pedido_id, nota);
    const {data,error} = await sb.functions.invoke("mintess-preparar",{body:{pedido_id, nota:nota||null}});
    if (error) return {ok:false, motivo:"erro", erro:error.message};
    return data||{ok:false};
  }
};
const nomeEu = () => S.perfil ? (S.perfil.nome||S.perfil.email) : "";
function demoHist(pid, evento, detalhe, interno, autor){ DEMO.hist.unshift({id:uid(), pedido_id:pid, evento, detalhe:detalhe||null, interno:!!interno, autor_nome:autor||nomeEu(), created_at:new Date().toISOString()}); }
function demoIns(k,row){
  const r = Object.assign({id:uid(), created_at:new Date().toISOString()}, row);
  if (k==="pedidos"){
    r.numero = Math.max(0,...DEMO.pedidos.map(p=>p.numero||0))+1;
    if (!ehM()){ r.status="recebido"; r.faixa=null; r.horas=null; r.cliente_id=S.perfil.cliente_id; }
    r.status=r.status||"recebido"; r.autor_nome=nomeEu(); r.updated_at=r.created_at;
    DEMO.pedidos.unshift(r); demoHist(r.id,"Pedido enviado",r.titulo,false); return clone(r);
  }
  if (k==="hist"){
    r.autor_nome = nomeEu(); r.interno = !!r.interno;
    DEMO.hist.unshift(r);
    if (!ehM() && r.evento==="Comentário"){ const p=DEMO.pedidos.find(x=>x.id===r.pedido_id); if (p && p.status==="aguardando_cliente") demoUpd("pedidos",p.id,{status:"recebido"}); }
    return clone(r);
  }
  DEMO[k].push(r); return clone(r);
}
function demoUpd(k,id,patch){
  const r = DEMO[k].find(x=>x[KEY[k]||"id"]===id); if (!r) throw new Error("Registro não encontrado");
  if (k==="pedidos" && patch.status && patch.status!==r.status){
    demoHist(id,"Status",r.status+" → "+patch.status,true);
    const txt = {no_ar:"Pronto! O ajuste já está no ar.", orcamento:"Este pedido é uma funcionalidade nova e será orçado à parte.", recusado:"Este pedido não pode ser feito neste formato de sistema."}[patch.status] || (patch.status==="preparando"&&r.status==="recebido" ? "Em produção." : null);
    if (txt) demoHist(id,"Atualização",txt,false,"MINTESS");
    patch.concluido_at = FECHADOS.includes(patch.status) ? new Date().toISOString() : null;
  }
  if (k==="pedidos") patch.updated_at = new Date().toISOString();
  Object.assign(r, patch); return clone(r);
}
async function demoPreparar(pid, nota){

    resumo:`${nota?"(Refeito com o seu ajuste: "+nota+") ":""}Na tela ${p.tela||"indicada"} do ${s?.nome||"sistema"}: ${p.titulo.toLowerCase()}. ${banco?"Precisa de um campo novo no banco (SQL idempotente, sem apagar nada).":"Só mudança de tela, sem mexer nos dados."}`,
    plano:[`Localizar a tela ${p.tela||""} no index.html`, banco?"Criar migração SQL com a coluna nova + GRANT":"Ajustar o HTML/CSS da tela", "Manter o padrão botões + campo livre", "Testar no celular (390px) e no computador"],
    perguntas: p.descricao ? [] : ["Pode mandar um exemplo de como gostaria que ficasse?"],
    resposta_cliente: fx==="laranja" ? "Seu pedido é uma funcionalidade nova. Preparamos um orçamento e enviamos em breve." : fx==="vermelho" ? "Esse pedido não é possível neste tipo de sistema, mas temos uma alternativa." : `Pronto! ${p.titulo} — já está no ar. Atualize o app para ver.`,
    prompt_execucao:`Repositório ${s?.repo||"—"}. Pedido #${p.numero}: ${p.titulo}.\nTela: ${p.tela||"—"}. Detalhes: ${p.descricao||"—"}\nContexto: ${s?.descricao_tecnica||"—"}\nCritérios de aceite: funciona em 390px e desktop; nada existente quebra; ${banco?"SQL idempotente com RLS e GRANT.":"sem mudança de banco."}`,
    link_previa: fx==="verde"||fx==="amarelo" ? `https://previa-${p.numero}.${(s?.repo||"sistema").split("/").pop()}.pages.dev` : null,

async function carregar(){

/* ================= modal ================= */
let MOD = null;
function modal(title, body, foot, opts={}){
  MOD = {dirty:false, arm:false};
  const old=$("#modal"), m=old.cloneNode(false); old.replaceWith(m); m.className="modal"+(opts.wide?" wide":"");
  m.innerHTML = `<div class="mh"><h2>${title}</h2><button class="btn ghost sm" data-act="fechar">Fechar</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:""}`;
  $("#mback").hidden=false; document.body.style.overflow="hidden";
  m.addEventListener("input", ()=>{ if (MOD) MOD.dirty=true; });
}
function fecharModal(force){
  if (!MOD) return;
  if (MOD.dirty && !force && !MOD.arm){ MOD.arm=true; const b=$("#modal [data-act=fechar]"); b.textContent="Fechar sem salvar?"; b.classList.add("warn"); return; }
  $("#mback").hidden=true; document.body.style.overflow=""; MOD=null;
}
const shake = () => { const m=$("#modal"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake"); };
$("#mback").addEventListener("click", e=>{ if (e.target.id==="mback") shake(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && MOD) shake(); });

function pick(name,label,val,opts,o={}){
  val = val ?? "";
  return `<div class="f"><label>${label}${o.req?" <em>*</em>":""}</label><div class="pk" data-pk="${name}">${opts.map(x=>`<button type="button" class="${String(x)===String(val)?"on":""}" data-pickv="${h(x)}">${h(o.fmt?o.fmt(x):x)}</button>`).join("")}</div>${o.noField?`<input type="hidden" name="${name}" value="${h(val)}">`:`<input class="in" name="${name}" ${o.num?'inputmode="decimal"':""} placeholder="${h(o.ph||"Outro…")}" value="${h(val)}">`}</div>`;
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-pickv]"); if(!b) return;
  const w=b.closest("[data-pk]"), inp=w.parentElement.querySelector(`[name="${w.dataset.pk}"]`);
  inp.value=b.dataset.pickv; w.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  if (MOD) MOD.dirty=true; inp.dispatchEvent(new Event("input",{bubbles:true}));
});
document.addEventListener("input", e=>{
  const inp=e.target; if(!inp.name||inp.type==="hidden") return;
  const w=inp.parentElement?.querySelector?.(`[data-pk="${inp.name}"]`);
  if (w) w.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.pickv===inp.value));
});
const fv = n => { const el=$(`#modal [name="${n}"]`); return el?el.value.trim():""; };
function erro(campo,txt){ const el=$(`#modal [name="${campo}"]`); toast(txt); if(el && el.type!=="hidden"){ el.focus(); el.style.borderColor="var(--rose)"; setTimeout(()=>el.style.borderColor="",2500);} }

function telasPick(s){ const t=(s?.telas||"").split(",").map(x=>x.trim()).filter(Boolean); return pick("tela","Em qual tela?","",t.concat(t.length?["Todas"]:[]),{ph:"Outra tela…"}); }
function reduzirImagem(file,max,q){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
  img.onerror=rej; img.src=url; }); }
async function pedidoSalvar(){
  const titulo=fv("titulo"), tipo=fv("tipo"), sid=fv("sistema_id");
  if (!sid) return erro("sistema_id","Escolha o sistema.");
  if (!titulo) return erro("titulo","Escreva em uma frase o que você quer.");
  if (titulo.length<8) return erro("titulo","Explique um pouco mais no título (mínimo 8 letras).");
  if (!tipo) return erro("tipo","Escolha o tipo de mudança.");
  const s = S.sistemas.find(x=>x.id===sid);
  const fx = triagem(tipo, titulo+" "+fv("descricao"));
  const btn=$("#modal [data-act=pedidoSalvar]"); btn.disabled=true; btn.textContent="Enviando…";
  try{
    const p = await db.ins("pedidos",{cliente_id:s.cliente_id, sistema_id:sid, titulo, tipo, tela:fv("tela")||null, descricao:fv("descricao")||null, urgencia:fv("urgencia")||"Normal", anexo:ANEXO, faixa_sugerida:fx});
    S.pedidos.unshift(p);
    fecharModal(true);
    modal("Pedido enviado ✓", `<div style="text-align:center;padding:6px 0"><div style="font-size:34px;color:var(--mint)">✦</div><h3 style="font-size:16px;margin:4px 0">Pedido #${p.numero} recebido</h3><p class="muted">${h(titulo)}</p></div>
      ${stepsCli("recebido")}
      <div class="box ${fx}"><b class="t"><span class="fx ${fx}">${FX[fx].t}</span></b>${FX[fx].m}</div>
      <p class="small muted">Você acompanha tudo aqui e é avisado quando estiver pronto.</p>`,
      `<button class="btn pri" data-act="fechar">Ok</button>`);
    render();
    prepararAuto(p.id, null, true);
  }catch(e){ btn.disabled=false; btn.textContent="Enviar pedido"; toast("Erro ao enviar: "+(e.message||e)); }
}
async function prepararAuto(pid, nota, silencioso){
  S.preparando[pid]=true; if (ehM()) render();
  const r = await db.preparar(pid, nota);
  delete S.preparando[pid];
  if (!r?.ok && !silencioso){
    if (r?.motivo==="sem_chave") toast("Preparação automática ainda não configurada (falta a chave do Claude). Use “Copiar para o Claude”.");
    else toast("Não consegui preparar: "+(r?.erro||r?.motivo||"erro"));
  }
  await carregar(); if (!MOD) render(); else if (ehM() && MOD.verId===pid) ver(pid);
  if (r?.ok && ehM()) toast("Pedido preparado pelo Claude ✓");
}

  const hist = S.hist.filter(x=>x.pedido_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const fx = p.faixa || pr?.faixa || p.faixa_sugerida;
  const info = `<div class="two"><div class="f"><label>Tipo / tela</label><div>${h(p.tipo||"—")}${p.tela?" · "+h(p.tela):""}</div></div><div class="f"><label>Urgência</label><div>${h(p.urgencia||"Normal")}</div></div></div>
    ${p.descricao?`<div class="f"><label>Detalhes</label><div style="white-space:pre-wrap">${h(p.descricao)}</div></div>`:""}

  const tl = `<div class="f" style="margin-top:12px"><label>Histórico</label><ul class="tl">${hist.map(x=>`<li class="${x.interno?"int":""}"><b>${h(x.evento)}</b>${x.interno?' <span class="chip" style="font-size:9.5px;padding:0 6px">interno</span>':""}${x.detalhe?` — <span style="white-space:pre-wrap">${/^https?:/.test(x.detalhe)?`<a href="${h(x.detalhe)}" target="_blank" rel="noopener">${h(x.detalhe)}</a>`:h(x.detalhe)}</span>`:""}<div class="w">${h(x.autor_nome||"")} · ${dt(x.created_at)}</div></li>`).join("")||"<li>—</li>"}</ul>
    <div class="row" style="margin-top:8px"><input class="in" id="comTxt" placeholder="${M?"Escrever ao cliente ou nota interna…":"Escrever uma mensagem para a MINTESS…"}" style="flex:1">
    ${M?`<button class="btn sec sm" data-act="comentar" data-id="${id}" data-v="pub">Enviar ao cliente</button><button class="btn ghost sm" data-act="comentar" data-id="${id}" data-v="int">Nota interna</button>`:`<button class="btn sec sm" data-act="comentar" data-id="${id}" data-v="pub">Enviar</button>`}</div></div>`;
  if (!M){
    const ask = p.status==="aguardando_cliente";

      ${p.status==="no_ar"?`<div class="box verde"><b class="t">✓ Pronto — já está no ar</b>Atualize o seu sistema (feche e abra o app) para ver a mudança.</div>`:""}
      ${info}${tl}`, "", {wide:true});
  } else {
    modal(`#${p.numero} · ${h(p.titulo)}`, `<div class="row"><span class="chip ${p.status==="aguardando_ok"?"hot":""}">${IN[p.status]}</span>${fx?`<span class="fx ${fx}">${FX[fx].t}</span>`:""}<span class="small muted">${h(nomeCli(p.cliente_id))} · ${h(nomeSis(p.sistema_id))} · ${h(p.autor_nome||"")} · ${dt(p.created_at)}</span></div>
      <div style="margin-top:10px">${info}</div>

      ${tl}`, "", {wide:true});
  }
  MOD.dirty=false; MOD.verId=id;
}

    ok:{t:"Publicar e avisar o cliente", body:`${pick("faixa","Faixa", p.faixa||pr.faixa||p.faixa_sugerida||"", ["verde","amarelo","laranja","vermelho"],{noField:true})}
      ${pick("horas","Horas a lançar no plano", pr.horas_estimadas!=null?String(pr.horas_estimadas).replace(".",","):"", ["0,25","0,5","1","2","4"],{num:true, ph:"Outro"})}
      <div class="f"><label>Mensagem ao cliente</label><textarea class="in" name="msg" style="min-height:60px">${h(pr.resposta_cliente||"Pronto! O seu ajuste já está no ar.")}</textarea></div>
      ${pr.mexe_banco?`<div class="box vermelho small"><b class="t">⚠ Este ajuste mexe no banco</b>Confira o SQL antes de publicar.</div>`:""}`, btn:"Confirmar e publicar"},
    ajustar:{t:"O que o Claude deve mudar na preparação?", body:`<textarea class="in" name="msg" placeholder="Ex.: em vez de vermelho, use o laranja da marca; e só para delivery."></textarea>`, btn:"Pedir ajuste ao Claude"},
    perguntar:{t:"Pergunta para o cliente", body:`<textarea class="in" name="msg">${h((pr.perguntas||[]).join(" "))}</textarea>`, btn:"Enviar pergunta"},
    orcamento:{t:"Mensagem ao cliente (orçamento)", body:`<textarea class="in" name="msg">${h(pr.faixa==="laranja"&&pr.resposta_cliente?pr.resposta_cliente:"Seu pedido é uma funcionalidade nova. Vamos preparar um orçamento e enviar em breve.")}</textarea>`, btn:"Enviar como orçamento"},
    recusar:{t:"Explique ao cliente por que não é possível", body:`<textarea class="in" name="msg">${h(pr.faixa==="vermelho"&&pr.resposta_cliente?pr.resposta_cliente:"")}</textarea>`, btn:"Enviar"}
  }[tipo];
  box.innerHTML = `<div class="decbox"><b>${cfg.t}</b><div style="margin-top:8px">${cfg.body}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="decCancelar">Cancelar</button><button class="btn pri sm" data-act="decConfirmar" data-v="${tipo}" data-id="${id}">${cfg.btn}</button></div></div>`;
  box.querySelector("textarea")?.focus();
}
async function confirmarDecisao(id, tipo){
  const msg = fv("msg");
  try{
    if (tipo==="ok"){
      const faixa=fv("faixa")||null, h_=fv("horas")?num(fv("horas")):null;
      if (h_===null) return erro("horas","Informe as horas a lançar (pode ser 0).");
      if (msg) await db.ins("hist",{pedido_id:id, evento:"Mensagem da MINTESS", detalhe:msg, interno:false});
      await db.upd("pedidos",id,{status:"no_ar", faixa, horas:h_});
      toast("Publicado ✓ — cliente avisado");
    } else if (tipo==="ajustar"){
      if (!msg) return erro("msg","Diga o que ajustar.");
      await db.upsertPrep({pedido_id:id, nota_tae:msg});
      await db.ins("hist",{pedido_id:id, evento:"Tae pediu ajuste", detalhe:msg, interno:true});
      await db.upd("pedidos",id,{status:"ajustar"});
      fecharModal(true); await carregar(); render();
      prepararAuto(id, msg, false); return;
    } else if (tipo==="perguntar"){
      if (!msg) return erro("msg","Escreva a pergunta.");
      await db.ins("hist",{pedido_id:id, evento:"Pergunta da MINTESS", detalhe:msg, interno:false});
      await db.upd("pedidos",id,{status:"aguardando_cliente"});
      toast("Pergunta enviada ao cliente");
    } else {
      if (!msg) return erro("msg","Escreva a mensagem ao cliente.");
      await db.ins("hist",{pedido_id:id, evento:"Mensagem da MINTESS", detalhe:msg, interno:false});
      await db.upd("pedidos",id,{status: tipo==="orcamento"?"orcamento":"recusado", faixa: tipo==="orcamento"?"laranja":"vermelho"});
      toast(tipo==="orcamento"?"Marcado como orçamento":"Cliente avisado");
    }
    fecharModal(true); await carregar(); render();
  }catch(e){ toast("Erro: "+(e.message||e)); }
}
function promptPedido(p){
  const s=S.sistemas.find(x=>x.id===p.sistema_id)||{};
  return `Sistema: ${s.nome||"—"} (${s.modelo||"Fechado"}) — ${s.url||""}\nRepositório: ${s.repo||"—"}\nContexto técnico: ${s.descricao_tecnica||"—"}\nCliente: ${nomeCli(p.cliente_id)}\n\nPEDIDO DE AJUSTE #${p.numero}\nTítulo: ${p.titulo}\nTipo: ${p.tipo||"—"} · Tela: ${p.tela||"—"} · Urgência: ${p.urgencia||"Normal"}\nDetalhes: ${p.descricao||"(sem detalhes)"}${p.anexo?"\n(O cliente anexou um print — está no portal.)":""}\n\nRegras: manter o padrão visual e de campos (botões + campo livre); não apagar dados; SQL idempotente com RLS e GRANT; entregar só os arquivos alterados e uma frase para eu responder ao cliente.`;
}
const copiar = (t,ok) => navigator.clipboard?.writeText(t).then(()=>toast(ok),()=>toast("Não consegui copiar"));

/* ================= cadastros (MINTESS) ================= */
function cliEditar(id){
  const c = S.clientes.find(x=>x.id===id) || {plano_horas:4, ativo:true};
  modal(id?"Editar cliente":"Novo cliente", `<div class="f"><label>Nome da empresa <em>*</em></label><input class="in" name="nome" value="${h(c.nome||"")}"></div>
    <div class="f"><label>Contato</label><input class="in" name="contato" value="${h(c.contato||"")}" placeholder="Nome, telefone…"></div>
    ${pick("plano_horas","Horas de ajuste incluídas por mês", c.plano_horas!=null?String(c.plano_horas).replace(".",","):"", ["2","4","8","12"],{num:true, req:true, ph:"Outro"})}
    ${pick("ativo","Situação", c.ativo===false?"Inativo":"Ativo", ["Ativo","Inativo"],{noField:true})}
    <div class="f"><label>Observações</label><input class="in" name="obs" value="${h(c.obs||"")}"></div>`,
    `<button class="btn pri" data-act="cliSalvar" data-id="${id||""}">Salvar</button>`);
}
async function cliSalvar(id){
  const nome=fv("nome"); if (!nome) return erro("nome","Informe o nome do cliente.");
  if (!id && S.clientes.some(c=>c.nome.toLowerCase()===nome.toLowerCase())) return erro("nome","Já existe um cliente com esse nome.");
  if (!fv("plano_horas")) return erro("plano_horas","Informe as horas do plano (pode ser 0).");
  const row={nome, contato:fv("contato")||null, plano_horas:num(fv("plano_horas")), ativo:fv("ativo")!=="Inativo", obs:fv("obs")||null};
  try{ if (id) await db.upd("clientes",id,row); else await db.ins("clientes",row); fecharModal(true); await carregar(); render(); toast("Cliente salvo"); }
  catch(e){ toast("Erro: "+(e.message||e)); }
}
function sisEditar(id, cli){
  const s = S.sistemas.find(x=>x.id===id) || {cliente_id:cli||S.clientes[0]?.id, modelo:"Fechado", ativo:true};
  if (!S.clientes.length) return toast("Cadastre um cliente primeiro.");
  modal(id?"Editar sistema":"Novo sistema", `
    <div class="f"><label>Cliente <em>*</em></label><div class="pk" data-pk="cliente_id">${S.clientes.map(c=>`<button type="button" class="${c.id===s.cliente_id?"on":""}" data-pickv="${c.id}">${h(c.nome)}</button>`).join("")}</div><input type="hidden" name="cliente_id" value="${h(s.cliente_id||"")}"></div>
    <div class="two"><div class="f"><label>Nome do sistema <em>*</em></label><input class="in" name="nome" value="${h(s.nome||"")}"></div>
    ${pick("modelo","Modelo", s.modelo, ["Fechado","Híbrido"],{noField:true})}</div>
    <div class="two"><div class="f"><label>Endereço (URL)</label><input class="in" name="url" value="${h(s.url||"")}" placeholder="https://…"></div><div class="f"><label>Repositório</label><input class="in" name="repo" value="${h(s.repo||"")}" placeholder="mintess/nome"></div></div>
    <div class="f"><label>Telas (separadas por vírgula — viram botões no pedido)</label><input class="in" name="telas" value="${h(s.telas||"")}" placeholder="Hoje, Pedidos, Caixa"></div>
    <div class="f"><label>Contexto técnico para o Claude</label><textarea class="in" name="descricao_tecnica" placeholder="Como o sistema é feito, tabelas, papéis, padrão visual…">${h(s.descricao_tecnica||"")}</textarea></div>`,
    `<button class="btn pri" data-act="sisSalvar" data-id="${id||""}">Salvar</button>`);
}
async function sisSalvar(id){
  const nome=fv("nome"), cli=fv("cliente_id");
  if (!cli) return erro("cliente_id","Escolha o cliente."); if (!nome) return erro("nome","Informe o nome do sistema.");
  const row={cliente_id:cli, nome, modelo:fv("modelo")||"Fechado", url:fv("url")||null, repo:fv("repo")||null, telas:fv("telas")||null, descricao_tecnica:fv("descricao_tecnica")||null};
  try{ if (id) await db.upd("sistemas",id,row); else await db.ins("sistemas",row); fecharModal(true); await carregar(); render(); toast("Sistema salvo"); }
  catch(e){ toast("Erro: "+(e.message||e)); }
}
function userEditar(uid_){
  const u = S.perfis.find(x=>x.user_id===uid_); if (!u) return;
  if (u.user_id===S.user.id) return toast("Você não pode mudar o seu próprio acesso.");
  modal("Acesso de "+h(u.nome||u.email), `<p class="small muted" style="margin-bottom:10px">${h(u.email)}</p>
    ${pick("papel","Papel", u.papel, ["pendente","cliente","mintess"],{noField:true, fmt:x=>PAPEL[x]})}
    <div class="f"><label>Empresa (para clientes)</label><div class="pk" data-pk="cliente_id">${S.clientes.map(c=>`<button type="button" class="${c.id===u.cliente_id?"on":""}" data-pickv="${c.id}">${h(c.nome)}</button>`).join("")}</div><input type="hidden" name="cliente_id" value="${h(u.cliente_id||"")}"></div>
    <div class="f"><label>Nome de exibição</label><input class="in" name="nome" value="${h(u.nome||"")}"></div>`,
    `<button class="btn pri" data-act="userSalvar" data-id="${u.user_id}">Salvar</button>`);
}
async function userSalvar(id){
  const papel=fv("papel"), cli=fv("cliente_id");
  if (papel==="cliente" && !cli) return toast("Escolha a empresa deste cliente.");
  try{ await db.upd("perfis",id,{papel, cliente_id: papel==="cliente"?cli:null, nome:fv("nome")||null}); fecharModal(true); await carregar(); render(); toast("Acesso atualizado"); }
  catch(e){ toast("Erro: "+(e.message||e)); }
}

/* ================= ações ================= */
const ACT = {
  login: async ()=>{ const e=$("#lemail").value.trim(), p=$("#lpass").value; if(!e) return lmsg("Informe o e-mail.","err"); if(!p) return lmsg("Informe a senha.","err");
    if(!sb) await iniciarLive(true); if(!sb) return; lmsg("Entrando…");
    const {data,error}=await sb.auth.signInWithPassword({email:e,password:p}); if(error) return lmsg(error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message,"err");
    MODE="live"; lmsg(""); entrar(data.user); },
  signup: async ()=>{ const e=$("#lemail").value.trim(), p=$("#lpass").value; if(!e) return lmsg("Informe o e-mail.","err"); if(p.length<6) return lmsg("A senha precisa de pelo menos 6 caracteres.","err");
    if(!sb) await iniciarLive(true); if(!sb) return; lmsg("Criando conta…");
    const {data,error}=await sb.auth.signUp({email:e,password:p}); if(error) return lmsg(error.message,"err");
    if (data.session){ MODE="live"; entrar(data.user); } else lmsg("Conta criada. Agora toque em Entrar.","ok"); },
  demo: ()=>iniciarDemo(),
  papelDemo: el=>papelDemo(el.dataset.v),
  sair: async ()=>{ if (MODE==="live"&&sb) await sb.auth.signOut(); location.reload(); },
  recarregar: ()=>location.reload(),
  menu: ()=>$("#side").classList.toggle("open"),
  go: el=>{ if (MOD) fecharModal(true); S.view=el.dataset.v; $("#side").classList.remove("open"); render(); scrollTo(0,0); },
  tab: el=>{ S.tab=el.dataset.v; render(); },
  tabCli: el=>{ S.tabCli=el.dataset.v; render(); },
  fechar: ()=>fecharModal(),
  pedidoNovo: ()=>{ $("#side").classList.remove("open"); pedidoNovo(); },
  pedidoSalvar: ()=>pedidoSalvar(),
  ver: el=>ver(el.dataset.id),
  preparar: el=>{ const id=el.dataset.id; prepararAuto(id, null, false); ver(id); },
  copiarPedido: el=>copiar(promptPedido(S.pedidos.find(x=>x.id===el.dataset.id)),"Pedido copiado — cole no Claude"),
  copiarExec: el=>copiar(prepDe(el.dataset.id)?.prompt_execucao||"","Instrução copiada"),
  salvarLink: async el=>{ try{ await db.upsertPrep({pedido_id:el.dataset.id, link_previa:$("#linkPrev").value.trim()||null}); await carregar(); toast("Link salvo"); ver(el.dataset.id); }catch(e){ toast("Erro: "+(e.message||e)); } },
  dec: el=>abrirDecisao(el.dataset.id, el.dataset.v),
  decCancelar: ()=>{ $("#decBox").innerHTML=""; },
  decConfirmar: el=>confirmarDecisao(el.dataset.id, el.dataset.v),
  reabrir: async el=>{ try{ await db.upd("pedidos",el.dataset.id,{status:"aguardando_ok"}); await carregar(); ver(el.dataset.id); render(); }catch(e){ toast("Erro: "+(e.message||e)); } },
  comentar: async el=>{ const t=$("#comTxt").value.trim(); if(!t) return toast("Escreva a mensagem.");
    const interno = el.dataset.v==="int";
    try{ await db.ins("hist",{pedido_id:el.dataset.id, evento: ehM()?(interno?"Nota interna":"Mensagem da MINTESS"):"Comentário", detalhe:t, interno}); await carregar(); ver(el.dataset.id); render(); toast(interno?"Nota salva":"Mensagem enviada"); }
    catch(e){ toast("Erro: "+(e.message||e)); } },
  responder: async el=>{ const t=$("#respTxt").value.trim(); if(!t){ $("#respTxt").focus(); return toast("Escreva a sua resposta."); }
    try{ await db.ins("hist",{pedido_id:el.dataset.id, evento:"Comentário", detalhe:t}); fecharModal(true); await carregar(); render(); toast("Resposta enviada — o pedido voltou para a fila"); }
    catch(e){ toast("Erro: "+(e.message||e)); } },
  cliEditar: el=>cliEditar(el.dataset.id),
  cliSalvar: el=>cliSalvar(el.dataset.id||null),
  sisEditar: el=>sisEditar(el.dataset.id, el.dataset.cli),
  sisSalvar: el=>sisSalvar(el.dataset.id||null),
  userEditar: el=>userEditar(el.dataset.id),
  userSalvar: el=>userSalvar(el.dataset.id)
};
document.addEventListener("click", e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if (el.tagName==="A") e.preventDefault(); const f=ACT[el.dataset.act]; if(f) f(el); });
document.addEventListener("change", e=>{ if (e.target.id==="filtroCli"){ S.filtroCli=e.target.value; render(); } });
$("#lpass").addEventListener("keydown", e=>{ if (e.key==="Enter") ACT.login(); });

async function atualizar(){ if (MODE!=="live"||MOD||!S.perfil||S.perfil.papel==="pendente") return; await carregar(); render(); }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) atualizar(); });
setInterval(atualizar, 45000);
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
iniciarLive();
</script>
</body>
